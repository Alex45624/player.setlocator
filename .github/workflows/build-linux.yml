name: Build Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller

      - name: Compilar PLAYER.SET.LOCATOR
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name PLAYER.SET.LOCATOR \
            main.py

      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: PLAYER.SET.LOCATOR-linux
          path: dist/PLAYER.SET.LOCATOR
